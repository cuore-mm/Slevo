schema: spec-driven

context: |
  All generated artifacts must be written in Japanese.
  Describe UI appearance and layout through intent, relative relationships, and shared components or styles, without specifying numeric tuning values such as spacing, dimensions, font sizes, corner radii, or animation durations.
  This restriction does not exclude numeric constraints required by external standards, accessibility requirements, or functional contracts.

rules:
  design:
    - Make the current and proposed behavior clear.
    - Explain relevant structure, processing, and data flow to the extent needed to understand design decisions.
    - Describe error handling, compatibility concerns, and verification strategy when relevant to the change.
    - Do not invent unverified file or function names; identify them as unresolved questions instead.

  tasks:
    - Every task must be executable and verifiable by the agent alone using available tools and permissions, without requiring human decisions or manual actions.
