name: Android CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode CI keystore
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CI_KEYSTORE_BASE64" | base64 --decode > ci-release.keystore
          keytool -list -keystore ci-release.keystore -storepass "${{ secrets.CI_KEYSTORE_PASSWORD }}" >/dev/null

      - name: Test + Build CI APK (retry once on failure)
        env:
          CI_KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew testCiUnitTest assembleCi --stacktrace || (
            echo "Gradle failed; cleaning snapshot/hash caches and retrying once..."
            rm -rf ~/.gradle/caches/*/fileHashes \
                   ~/.gradle/caches/*/fileSnapshots \
                   ~/.gradle/caches/journal-1 || true
            ./gradlew testCiUnitTest assembleCi --stacktrace
          )

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-ci-apk
          path: app/build/outputs/apk/ci/*.apk
